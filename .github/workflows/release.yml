# Release flow:
# 1. Merge your changes into main.
# 2. Tag that commit on main as vX.Y.Z (e.g. git tag v1.0.3).
# 3. Push the tag (git push origin v1.0.3) to trigger this workflow.

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-main:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tagged commit is an ancestor of origin/main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on origin/main. Merge to main before tagging a release."
            exit 1
          fi

  create-release:
    name: Create GitHub Release
    needs: verify-main
    runs-on: ubuntu-latest
    steps:
      - name: Create published release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi

  windows:
    name: Build & Publish (Windows x64)
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Electron mode)
        working-directory: frontend
        run: npm run build

      - name: Publish .NET backend (win-x64)
        working-directory: backend
        run: >
          dotnet publish backend/backend.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ../electron/resources/api

      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      - name: Set version from tag
        working-directory: electron
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Package and publish Windows installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  macos:
    name: Build & Publish (macOS arm64)
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Electron mode)
        working-directory: frontend
        run: npm run build

      - name: Publish .NET backend (osx-arm64)
        working-directory: backend
        run: >
          dotnet publish backend/backend.csproj
          --configuration Release
          --runtime osx-arm64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output ../electron/resources/api

      - name: Install electron dependencies
        working-directory: electron
        run: npm ci

      - name: Set version from tag
        working-directory: electron
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Package and publish macOS DMG & ZIP
        working-directory: electron
        # When MAC_SIGNING is not 'true' (e.g. before Apple Developer ID secrets are added),
        # electron-builder.config.js disables signing and notarization so the build still succeeds.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_SIGNING: ${{ vars.MAC_SIGNING || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish always
